name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * *'   # daily: pick up new omarchy-pkgs versions
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild everything, even versions already published
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    # one run per arch at a time: two would race on that arch's release db
    concurrency:
      group: build-${{ matrix.arch }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      ARCH: ${{ matrix.arch }}
      # Builds publish to the testing channel; promote.yml copies to stable.
      TAG: omartix-testing-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure the release exists
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "omartix-testing ($ARCH)" --latest=false --prerelease \
            --notes "pacman repo [omartix-testing] for $ARCH. Server = https://github.com/${{ github.repository }}/releases/download/omartix-testing-\$arch"

      - name: Fetch the published db
        run: |
          mkdir -p out/current
          gh release download "$TAG" -D out/current \
            -p 'omartix-testing.db.tar.gz' -p 'omartix-testing.files.tar.gz' || true

      # aarch64 only: Armtix's reachable mirror refuses GitHub's runners
      # (Cloudflare 403), so join the tailnet as an ephemeral tag:ci node and
      # pull from our mirror on pve2. The tailnet policy lets tag:ci reach that
      # mirror on port 80 and nothing else. Skipped until vars.ARMTIX_MIRROR is set.
      - name: Join the tailnet
        if: matrix.arch == 'aarch64' && vars.ARMTIX_MIRROR != ''
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Build
        env:
          ARMTIX_MIRROR: ${{ vars.ARMTIX_MIRROR }}
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
          OMARCHY_ARTIX_TOKEN: ${{ secrets.OMARCHY_ARTIX_TOKEN }}
          FORCE: ${{ inputs.force || 'false' }}
        run: sudo --preserve-env=PKG_SIGNING_KEY,OMARCHY_ARTIX_TOKEN,FORCE,TAG,ARMTIX_MIRROR ci/build.sh

      - name: Publish
        run: sudo chown -R "$USER" out && ci/publish.sh

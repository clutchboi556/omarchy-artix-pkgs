name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * *'   # daily: pick up new omarchy-pkgs versions
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild everything, even versions already published
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    # one run per arch at a time: two would race on that arch's release db
    concurrency:
      group: build-${{ matrix.arch }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure the release exists
        run: |
          gh release view "$ARCH" >/dev/null 2>&1 || gh release create "$ARCH" \
            --title "$ARCH packages" --latest=false \
            --notes "pacman repo for omarchy-artix on $ARCH. Server = https://github.com/${{ github.repository }}/releases/download/$ARCH"

      - name: Fetch the published db
        run: |
          mkdir -p out/current
          gh release download "$ARCH" -D out/current \
            -p 'omarchy-artix.db.tar.gz' -p 'omarchy-artix.files.tar.gz' || true

      - name: Build
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
          OMARCHY_ARTIX_TOKEN: ${{ secrets.OMARCHY_ARTIX_TOKEN }}
          FORCE: ${{ inputs.force || 'false' }}
        run: sudo --preserve-env=PKG_SIGNING_KEY,OMARCHY_ARTIX_TOKEN,FORCE ci/build.sh

      - name: Publish
        run: sudo chown -R "$USER" out && ARCH="$ARCH" ci/publish.sh
